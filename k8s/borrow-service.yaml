apiVersion: apps/v1
kind: Deployment
metadata:
  name: borrow-service
  labels:
    app: borrow-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: borrow-service
  template:
    metadata:
      labels:
        app: borrow-service
    spec:
      containers:
        - name: borrow-service
          image: libraflow-borrow-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: BOOK_SERVICE_URL
              value: "http://book-service:4001"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4003"
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/libraflow"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 160Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: borrow-service
  labels:
    app: borrow-service
spec:
  ports:
    - port: 4002
      targetPort: 4002
  selector:
    app: borrow-service
